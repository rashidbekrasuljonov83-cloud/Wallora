<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Asosiy neon gradient -->
    <linearGradient id="walloraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#D946EF" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Kichik qatlamlar uchun shaffof gradient -->
    <linearGradient id="layerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0.8" />
    </linearGradient>

    <!-- Soyalar uchun filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Orqa fon (To'q va yumshoq burchakli karta) -->
  <rect width="512" height="512" rx="112" fill="#0F172A" />

  <!-- Ichki chegara / Ramka -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#walloraGrad)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Markaziy W va oboy qatlamlari guruhi -->
  <g filter="url(#shadow)" transform="translate(0, 10)">
    
    <!-- Orqa 2-qatlam (Fon oboy qatlami) -->
    <path d="M 136 140 L 196 140 L 256 250 L 316 140 L 376 140 L 326 240 L 376 140 L 416 140 L 336 300 L 256 380 L 176 300 L 96 140 L 136 140 Z" fill="url(#layerGrad)" opacity="0.4" transform="scale(0.85) translate(45, 20)" />

    <!-- Orqa 1-qatlam -->
    <path d="M 120 150 L 180 150 L 256 290 L 332 150 L 392 150 L 312 310 L 256 390 L 200 310 Z" fill="url(#layerGrad)" opacity="0.7" transform="scale(0.92) translate(22, 10)" />

    <!-- Asosiy va oldingi "W" harfi (To'liq qatlamli va o'tkir kesilgan) -->
    <path d="M 104 160 
             H 164 
             L 226 280 
             L 256 220 
             L 286 280 
             L 348 160 
             H 408 
             L 328 320 
             L 256 410 
             L 184 320 
             Z" 
          fill="url(#walloraGrad)" />

    <!-- W ning ustki yorug'lik urg'ulari (Highlights) -->
    <path d="M 104 160 L 164 160 L 226 280 L 256 220 L 286 280 L 348 160 L 408 160" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>
